services:
  app:
    build:
      context: .
    container_name: tallcms-app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - tallcms_storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: tallcms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - tallcms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tallcms_db_data:
  tallcms_storage_data:
